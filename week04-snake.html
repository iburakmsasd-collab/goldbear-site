<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
  <title>Snake</title>
</head>
<body>
  <h1>snek gmae</h1>
  <p><a href="index.html">Back to home</a></p>
  <p>use arrot keys to move</p>
  <p>game work in progress</p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
</body>
<script>
     var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var CELL = 20;
    var snake = { x: 10, y: 10 };
  var dx = 5; // how far snake.x changes each step
var dy = 0;  // how far snake.y changes each step
  function drawBoard() {
  ctx.fillStyle = "#1b1b1b";
  ctx.fillRect(0, 0, 400, 400);
 
  ctx.fillStyle = "#3ddc84";
  ctx.fillRect(snake.x, snake.y, 20, 20);
}
 
drawBoard();

function step() {
  snake.x = snake.x + dx;
  snake.y = snake.y + dy;
  if (snake.x > 380) { snake.x = 0; }
  if (snake.x < 0) { snake.x = 380; }
  if (snake.y > 380) { snake.y = 0; }
  if (snake.y < 0) { snake.y = 380; }

  drawBoard();
}
  
setInterval(step, 35);

document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowRight") {
    dx = 5;
    dy = 0;
  }
  if (event.key === "ArrowLeft") {
    dx = -5;
    dy = 0;
  }
  if (event.key === "ArrowDown") {
    dx = 0;
    dy = 5;
  }
   if (event.key === "ArrowUp") {
    dx = 0;
    dy = -5;
  }
});



</script>
</html>
