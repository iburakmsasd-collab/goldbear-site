<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
  <title>Snake</title>
</head>
<body>
  <h1>snek game</h1>
  <p><a href="index.html">Back to home</a></p>
    <p>use arrow keys to move</p>
  <p>game work in progress</p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
</body>
<script>
var canvas = document.getElementById("gameCanvas");
var ctx = canvas.getContext("2d");
var CELL = 20;
var snake = { x: 10, y: 10 };
var dx = 5; // how far snake.x changes each step
var dy = 0;  // how far snake.y changes each step
var body = [];        // every square the snake is made of
var snakeLength = 2;  // how long it is supposed to be
var apple = { x: 200, y: 200 };
  
  
function drawBoard() {
  ctx.fillStyle = "#1b1b1b";
  ctx.fillRect(0, 0, 400, 400);
 
  ctx.fillStyle = "#3ddc84";
  for (var i = 0; i < body.length; i++) {
    ctx.fillRect(body[i].x, body[i].y, 20, 20);
  }
  ctx.fillStyle = "red";
  ctx.fillRect(apple.x, apple.y, 20, 20);

  if (snake.x === apple.x && snake.y === apple.y) {
    snakeLength = snakeLength + 1;
    apple.x = Math.floor(Math.random() * 20) * 20;
    apple.y = Math.floor(Math.random() * 20) * 20;
  }


}


drawBoard();

function step() {
  snake.x = snake.x + dx;
  snake.y = snake.y + dy;
  if (snake.x > 400) { snake.x = -20; }
  if (snake.x < -20) { snake.x = 400; }
  if (snake.y > 400) { snake.y = -20; }
  if (snake.y < -20) { snake.y = 400; }

  for (var i = 0; i < body.length; i++) {
  if (body[i].x === snake.x && body[i].y === snake.y) {
      clearInterval(timer);
      alert("Game over");
      return;
    }
  }

  
    body.push({ x: snake.x, y: snake.y });
 
  while (body.length > snakeLength) {
    body.shift();
  }


  drawBoard();
}
  
document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowRight") {
    dx = 5;
    dy = 0;
  }
  if (event.key === "ArrowLeft") {
    dx = -5;
    dy = 0;
  }
  if (event.key === "ArrowDown") {
    dx = 0;
    dy = 5;
  }
   if (event.key === "ArrowUp") {
    dx = 0;
    dy = -5;
  }
});


var timer = setInterval(step, 35);   // was: setInterval(step, 100);


</script>
</html>
